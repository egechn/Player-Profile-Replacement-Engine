source:
  name: Opta Power Rankings league table
  article_url: https://theanalyst.com/articles/strongest-football-leagues-in-the-world-opta-power-rankings
  iframe_url: https://dataviz.theanalyst.com/opta-power-rankings/?leagueRankings=true&limit=50
  data_file: https://dataviz.theanalyst.com/opta-power-rankings/league-meta.json
  article_published: 2025-11-04
  data_last_updated: 2026-10-13  # top 100 pasted by Ege from the Opta Power Rankings table;
  # ranks 82, 97 and 99 were left out because their names were ambiguous
  metric: seasonAverageRating
reference_league: Premier League
reference_rating: 92.7
coefficient_formula: seasonAverageRating / reference_rating
# Leagues outside the Opta top 100 (below 67.4) and teams with no league.
default_strength: 0.72
# Output metrics (goals, chances, successful actions...) are multiplied by
# coefficient ** metric_translation_exponent before percentiles, so production
# in weaker leagues counts for less (exponent 2: Eredivisie 0.86 -> x0.74).
# See src/features/league_adjustment.py.
metric_translation_exponent: 2.0
# League strength is already inside the metrics, so the extra similarity
# multiplier is off by default (it double counted league strength).
league_similarity_weight: 0.0
